# Publishes the static demo build (transcription runs in the visitor's browser; no server or API
# key) to GitHub Pages at https://<owner>.github.io/<repo>/. The build downloads the speaker
# models from sherpa-onnx's GitHub releases (checksum-verified, see scripts/fetch-speech-models.mjs).
#
# Works with either Pages source (Settings → Pages → Build and deployment → Source):
#   - "GitHub Actions": served by the deploy job below.
#   - "Deploy from a branch" (gh-pages, / (root)): served from the gh-pages branch this workflow updates.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Only deploy from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          # transformers.js pulls in onnxruntime-node, whose install would fetch ~240 MB of unused CUDA libraries.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build the demo
        run: npm run build:pages

      - name: Show the repository's Pages configuration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true

      - name: Publish to the gh-pages branch
        working-directory: dist/pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy demo from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    # Fails harmlessly when Pages is set to "Deploy from a branch" (the gh-pages branch serves the site then).
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
